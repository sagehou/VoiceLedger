name: Android GGUF adapter verification

on:
  push:
    branches: [ci/vl-sensevoice-gguf]

permissions:
  contents: read

jobs:
  android-gguf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '12266719'
          packages: ndk;28.2.13676358
      - run: |
          ndk="$ANDROID_HOME/ndk/28.2.13676358"
          python3 scripts/build_sensevoice_gguf.py --work "$RUNNER_TEMP/gguf" --output artifacts --android-ndk "$ndk"
          "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h -d artifacts/libvoiceledger_sensevoice_gguf.so
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: android-sensevoice-gguf
          path: artifacts/
