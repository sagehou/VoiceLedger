name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_CMDLINE_TOOLS_VERSION: '12266719'
  ANDROID_NDK_VERSION: '28.2.13676358'
  JAVA_VERSION: '17.0.18+8'

jobs:
  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: core
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test the shared core
        run: |
          mkdir -p artifacts
          cargo test --workspace --locked -- --nocapture 2>&1 | tee artifacts/rust-core.log
      - run: cargo build --release --locked --package voiceledger-ffi
      - name: Build and exercise native speech adapters with model-free inputs
        run: python3 ../scripts/build_speech.py --work "$RUNNER_TEMP/voiceledger-speech" --output artifacts/speech
      - name: Build and run the native translation adapter without network access
        run: |
          model="$RUNNER_TEMP/voiceledger-translation/模型"
          python3 ../scripts/build_translation.py --work "$RUNNER_TEMP/voiceledger-translation" --output artifacts/speech
          python3 ../scripts/check_translation.py "$model"
          sudo unshare --net --setgid="$(id -g)" --setuid="$(id -u)" -- "$(command -v python3)" \
            ../scripts/check_translation.py "$model" --library artifacts/speech/libvoiceledger_translation.so \
            --report artifacts/translation.json --offline
          cargo test --workspace --locked --no-run --message-format=json > "$RUNNER_TEMP/voiceledger-test-binaries.jsonl"
          test_binary="$(python3 -c 'import json, sys; print(next(item["executable"] for line in sys.stdin if (item := json.loads(line)).get("executable") and item["target"]["name"] == "voiceledger_speech"))' < "$RUNNER_TEMP/voiceledger-test-binaries.jsonl")"
          sudo unshare --net --setgid="$(id -g)" --setuid="$(id -u)" -- env \
            VOICELEDGER_TEST_TRANSLATION_MODEL="$model" VOICELEDGER_TEST_TRANSLATION_ADAPTERS="$PWD/artifacts/speech" \
            "$test_binary" --exact tests::native_translation_app_flow --ignored --nocapture
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Evaluate speaker embeddings without network access
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng
          python3 -m venv "$RUNNER_TEMP/voiceledger-speaker-venv"
          converter="$RUNNER_TEMP/voiceledger-speaker-venv/bin/python"
          "$converter" -m pip install --only-binary=:all: --no-deps \
            numpy==2.2.6 onnx==1.18.0 protobuf==6.31.1 typing-extensions==4.15.0
          "$converter" ../scripts/evaluate_speakers.py "$RUNNER_TEMP/voiceledger-speaker"
          cargo build --locked --example speaker_clusters
          for candidate in fp32 int8; do
            sudo unshare --net --setgid="$(id -g)" --setuid="$(id -u)" -- env \
              LD_LIBRARY_PATH="$PWD/artifacts/speech" "$(command -v python3)" \
              ../scripts/evaluate_speakers.py "$RUNNER_TEMP/voiceledger-speaker" --candidate "$candidate" \
              --library artifacts/speech/libvoiceledger_speaker.so --clustering target/debug/examples/speaker_clusters \
              --report "artifacts/speaker-evaluation-$candidate.json"
          done
      - name: Verify automatic Chinese, English and Japanese recognition offline
        run: |
          sudo apt-get install -y --no-install-recommends open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001
          samples="$RUNNER_TEMP/voiceledger-asr"
          python3 ../scripts/check_asr_languages.py "$samples"
          sudo unshare --net --setgid="$(id -g)" --setuid="$(id -u)" -- "$(command -v python3)" \
            ../scripts/check_asr_languages.py "$samples" --library artifacts/speech/libvoiceledger_whisper.so \
            --report artifacts/asr-automatic-languages.json
      - name: Exercise live committed audio and final-only translation offline
        run: |
          sudo unshare --net --setgid="$(id -g)" --setuid="$(id -u)" -- "$(command -v python3)" \
            ../scripts/check_live_speech.py "$RUNNER_TEMP/voiceledger-asr" "$RUNNER_TEMP/voiceledger-translation/模型" \
            target/release/libvoiceledger_ffi.so artifacts/speech artifacts/live-speech.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: live-speech
          path: |
            core/artifacts/live-speech.json
            core/artifacts/live-speech-english.f32
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: asr-automatic-languages
          path: core/artifacts/asr-automatic-languages.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: speaker-evaluation
          path: core/artifacts/speaker-evaluation-*.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: voiceledger-ffi-linux-x64
          path: core/target/release/libvoiceledger_ffi.so
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: rust-core-report
          path: |
            core/artifacts/rust-core.log
            core/artifacts/translation.json

  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo build --workspace --release --locked --target x86_64-pc-windows-msvc
      - name: Recover synthetic recordings after a writer process exits
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          cargo test --release --locked -p voiceledger-audio --target x86_64-pc-windows-msvc -- --nocapture 2>&1 | Tee-Object artifacts/windows-recovery.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and exercise native speech adapters on Windows
        run: python ../scripts/build_speech.py --work "$env:RUNNER_TEMP/voiceledger-speech" --output artifacts/speech
      - name: Build and exercise the Windows translation adapter
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'voiceledger-translation/模型'
          python ../scripts/build_translation.py --work "$env:RUNNER_TEMP/voiceledger-translation" --output artifacts/speech
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../scripts/check_translation.py "$model"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../scripts/check_translation.py "$model" --library artifacts/speech/voiceledger_translation.dll --report artifacts/translation.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-translation-report
          path: core/artifacts/translation.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: voiceledger-speech-windows-x64
          path: core/artifacts/speech/
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-audio-recovery
          path: core/artifacts/windows-recovery.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: voiceledger-core-windows-x64
          path: core/target/x86_64-pc-windows-msvc/release/voiceledger_ffi.dll
          if-no-files-found: error

  rust-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}
          packages: ndk;${{ env.ANDROID_NDK_VERSION }}
      - run: rustup target add aarch64-linux-android
      - name: Build for Android arm64 at API 26
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_PLATFORM=android-26
          ndk_tools="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ndk_tools/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          export AR_aarch64_linux_android="$ndk_tools/llvm-ar"
          cargo build --workspace --release --locked --target aarch64-linux-android
          python3 ../scripts/build_speech.py --work "$RUNNER_TEMP/voiceledger-speech" \
            --output artifacts/speech --android-ndk "$ANDROID_NDK_HOME"
          python3 ../scripts/build_translation.py --work "$RUNNER_TEMP/voiceledger-translation" \
            --output artifacts/speech --android-ndk "$ANDROID_NDK_HOME"
          "$ndk_tools/llvm-readelf" --file-header artifacts/speech/libvoiceledger_translation.so > artifacts/translation-android.txt
          grep -E 'Machine:[[:space:]]+AArch64' artifacts/translation-android.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: voiceledger-speech-android-arm64-v8a
          path: core/artifacts/speech/
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: voiceledger-core-android-arm64-v8a
          path: core/target/aarch64-linux-android/release/libvoiceledger_ffi.so
          if-no-files-found: error

  windows-client:
    runs-on: windows-latest
    needs: [rust-windows, contracts, rust-core]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: windows/**/packages.lock.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: voiceledger-core-windows-x64
          path: windows/VoiceLedger/native
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: voiceledger-speech-windows-x64
          path: windows/VoiceLedger/native/speech
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: domain-fixtures-v1
          path: artifacts/domain-fixtures-v1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: live-speech
          path: artifacts/live-speech
      - name: Restore, build and publish WPF
        run: |
          dotnet restore windows/VoiceLedger.slnx --locked-mode 2>&1 | Tee-Object artifacts/windows-restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build windows/VoiceLedger.slnx --configuration Release --no-restore 2>&1 | Tee-Object artifacts/windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish windows/VoiceLedger/VoiceLedger.csproj --configuration Release --no-build --output artifacts/windows 2>&1 | Tee-Object artifacts/windows-publish.log
      - name: Run WPF ABI and synthetic capture checks
        run: |
          dotnet run --project windows/VoiceLedger.CoreSmoke/VoiceLedger.CoreSmoke.csproj --configuration Release --no-build -- contracts/fixtures/ffi-v1.tsv artifacts/domain-fixtures-v1 2>&1 | Tee-Object artifacts/windows-ffi.log
      - name: Verify the PowerShell WASAPI evidence script
        shell: powershell
        run: |
          .\scripts\Test-WasapiEvidence.ps1 | Tee-Object artifacts/windows-evidence.log
          Copy-Item scripts/Measure-WasapiEvidence.ps1 artifacts/
      - name: Check the publish output
        run: |
          foreach ($file in 'VoiceLedger.exe', 'VoiceLedger.dll', 'VoiceLedger.runtimeconfig.json', 'voiceledger_ffi.dll', 'NAudio.Wasapi.dll', 'NAudio.Core.dll') {
            if (-not (Test-Path "artifacts/windows/$file" -PathType Leaf)) {
              throw "Publish output is missing $file"
            }
          }
          (Get-Item artifacts/windows/voiceledger_ffi.dll).Length | Set-Content artifacts/windows-native-bytes.log
          foreach ($file in 'voiceledger_whisper.dll', 'voiceledger_sensevoice.dll', 'voiceledger_translation.dll', 'voiceledger_speaker.dll', 'sherpa-onnx-c-api.dll', 'onnxruntime.dll') {
            if (-not (Test-Path "artifacts/windows/speech/$file" -PathType Leaf)) {
              throw "Publish output is missing speech/$file"
            }
          }
      - name: Check the separate Windows speech worker without model weights
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'voiceledger-speech-worker'
          $request = @{
            recordings = $root
            profiles = $root
            adapters = (Resolve-Path 'artifacts/windows/speech').Path
            action = @{ op = 'install'; model_id = 'whisper-tiny-multilingual-q5-1'; approved = $false }
          } | ConvertTo-Json -Compress
          $info = [System.Diagnostics.ProcessStartInfo]::new((Resolve-Path 'artifacts/windows/VoiceLedger.exe').Path)
          $info.UseShellExecute = $false
          $info.CreateNoWindow = $true
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true
          $info.ArgumentList.Add('--speech-worker')
          $info.ArgumentList.Add($request)
          $process = [System.Diagnostics.Process]::Start($info)
          $stderr = $process.StandardError.ReadToEndAsync()
          if (-not $process.WaitForExit(15000)) {
            $process.Kill($true)
            throw 'Speech worker did not terminate'
          }
          if ($process.ExitCode -ne -34 -or (Test-Path (Join-Path $root 'models'))) {
            throw "Speech worker failed the approval check (exit $($process.ExitCode)). $($stderr.GetAwaiter().GetResult())"
          }
          'Windows speech worker rejected unapproved work.' | Set-Content artifacts/windows-speech-worker.log
      - name: Verify live text through the packaged Windows worker
        run: |
          $catalog = Get-Content models/catalog-v1.json -Raw | ConvertFrom-Json
          $model = $catalog.models | Where-Object id -eq 'whisper-tiny-multilingual-q5-1'
          $profile = Join-Path $env:RUNNER_TEMP "voiceledger-live-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $modelDir = Join-Path $profile "models/$($model.id)-$($model.version)"
          New-Item -ItemType Directory -Force $modelDir | Out-Null
          foreach ($artifact in $model.artifacts) {
            $file = Join-Path $modelDir $artifact.file
            Invoke-WebRequest $artifact.url -OutFile $file
            if ((Get-FileHash -Algorithm SHA256 $file).Hash -ne $artifact.sha256) {
              throw 'Whisper weight checksum mismatch'
            }
          }
          $executable = (Resolve-Path 'artifacts/windows/VoiceLedger.exe').Path
          $sample = (Resolve-Path 'artifacts/live-speech/live-speech-english.f32').Path
          dotnet run --project windows/VoiceLedger.CoreSmoke/VoiceLedger.CoreSmoke.csproj --configuration Release --no-build -- --live-speech $executable $profile $sample 2>&1 | Tee-Object artifacts/windows-live-speech.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-client
          path: |
            artifacts/windows/
            artifacts/windows-*.log
            artifacts/Measure-WasapiEvidence.ps1

  android-client:
    runs-on: ubuntu-latest
    needs: [rust-core, rust-android, contracts]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/gradle.lockfile
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}
          packages: platforms;android-36 build-tools;36.0.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: voiceledger-core-android-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: voiceledger-speech-android-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a
      - name: Include the native speech component notices
        run: |
          mkdir -p app/src/main/assets/speech-notices
          mv app/src/main/jniLibs/arm64-v8a/*.md app/src/main/jniLibs/arm64-v8a/*.txt app/src/main/assets/speech-notices/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: voiceledger-ffi-linux-x64
          path: android/app/native-test
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: domain-fixtures-v1
          path: artifacts/domain-fixtures-v1
      - name: Build and check the Android app
        run: |
          mkdir -p artifacts
          ./gradlew --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee artifacts/android-gradle.log
      - name: Check the APK manifest
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > artifacts/android-apk.txt
          grep -E "^package: name='com\.voiceledger\.app'" artifacts/android-apk.txt
          grep -E "^launchable-activity: name='com\.voiceledger\.app\.MainActivity'" artifacts/android-apk.txt
          apkanalyzer manifest print "$apk" > artifacts/android-manifest.xml
          python3 - <<'PY'
          from xml.etree import ElementTree

          manifest = ElementTree.parse("artifacts/android-manifest.xml")
          ns = "{http://schemas.android.com/apk/res/android}"
          permissions = {entry.get(ns + "name") for entry in manifest.findall("uses-permission")}
          required = {"RECORD_AUDIO", "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_MICROPHONE", "POST_NOTIFICATIONS", "INTERNET"}
          assert {"android.permission." + name for name in required} <= permissions, permissions
          assert "android.permission.RECEIVE_BOOT_COMPLETED" not in permissions
          application = manifest.find("application")
          assert application.get(ns + "allowBackup") == "false"
          assert application.get(ns + "dataExtractionRules")
          service, = (
              item for item in manifest.findall("application/service")
              if item.get(ns + "name", "").endswith(".recording.RecordingService")
          )
          service_type = service.get(ns + "foregroundServiceType", "")
          assert service_type == "microphone" or int(service_type, 0) == 0x80, service.attrib
          assert service.get(ns + "exported") == "false", service.attrib
          assert service.get(ns + "directBootAware") != "true", service.attrib
          speech, = (
              item for item in manifest.findall("application/service")
              if item.get(ns + "name", "").endswith(".speech.SpeechWorkerService")
          )
          assert speech.get(ns + "exported") == "false", speech.attrib
          assert speech.get(ns + "process", "").endswith(":speech"), speech.attrib
          PY
          unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libvoiceledger_ffi.so'
          for library in voiceledger_whisper voiceledger_sensevoice voiceledger_translation voiceledger_speaker sherpa-onnx-c-api onnxruntime; do
            unzip -Z1 "$apk" | grep -Fx "lib/arm64-v8a/lib${library}.so"
          done
          stat -c '%s' app/src/main/jniLibs/arm64-v8a/libvoiceledger_ffi.so > artifacts/android-native-bytes.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: android-client
          path: |
            android/artifacts/
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/apk/debug/app-debug.apk

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate the evidence and domain schemas
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/voiceledger-ci"
          ci_python="$RUNNER_TEMP/voiceledger-ci/bin/python"
          "$ci_python" -m pip install --only-binary=:all: -r scripts/requirements.txt
          mkdir -p artifacts
          "$ci_python" scripts/validate_evidence.py 2>&1 | tee artifacts/contracts.log
          "$ci_python" scripts/validate_domain.py artifacts/domain-fixtures-v1 2>&1 | tee -a artifacts/contracts.log
          "$ci_python" scripts/validate_model_catalog.py 2>&1 | tee -a artifacts/contracts.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: domain-fixtures-v1
          path: artifacts/domain-fixtures-v1/
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: contracts-report
          path: artifacts/contracts.log

  security-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check workflow syntax and shell scripts
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.8
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - name: Scan locked dependencies and report licenses
        shell: bash
        run: |
          mkdir -p artifacts
          scanner="$RUNNER_TEMP/voiceledger-osv-scanner"
          curl --fail --silent --show-error --location --retry 3 --output "$scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          printf '%s  %s\n' '160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b' "$scanner" | sha256sum --check
          chmod +x "$scanner"
          "$scanner" scan source --licenses \
            --lockfile=core/Cargo.lock \
            --lockfile=android/app/gradle.lockfile \
            --lockfile=windows/VoiceLedger/packages.lock.json \
            --lockfile=windows/VoiceLedger.CoreSmoke/packages.lock.json \
            --lockfile=scripts/requirements.txt 2>&1 | tee artifacts/dependency-scan.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: security-static-report
          path: artifacts/dependency-scan.log

  gate:
    name: CI gate
    if: always()
    needs: [rust-core, rust-windows, rust-android, windows-client, android-client, contracts, security-static]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs to pass
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$CI_RESULTS"
