name: Android Nemotron diagnostics
on:
  push:
    branches: [ci/vl-android-nemotron-diagnostics]
permissions:
  contents: read
  actions: read

env:
  ANDROID_CMDLINE_TOOLS_VERSION: '12266719'
  ANDROID_NDK_VERSION: '28.2.13676358'
  JAVA_VERSION: '17.0.18+8'

jobs:
  android-client:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/gradle.lockfile
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}
          packages: platforms;android-36 build-tools;36.0.0 platform-tools emulator system-images;android-35;google_apis;x86_64
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          run-id: 45766525454
          name: voiceledger-core-android-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          run-id: 45766525454
          name: voiceledger-speech-android-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a
      - name: Include the native speech component notices
        run: |
          mkdir -p app/src/main/assets/speech-notices
          mv app/src/main/jniLibs/arm64-v8a/*.md app/src/main/jniLibs/arm64-v8a/*.txt app/src/main/assets/speech-notices/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          run-id: 45766525454
          name: voiceledger-ffi-linux-x64
          path: android/app/native-test
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          run-id: 45766525454
          name: domain-fixtures-v1
          path: artifacts/domain-fixtures-v1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          run-id: 45766525454
          name: live-speech
          path: android/live-speech
      - name: Build and check the Android app
        run: |
          mkdir -p artifacts app/src/androidTest/assets
          cp live-speech/*.f32 live-speech/live-speech-corpus.json app/src/androidTest/assets/
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee artifacts/android-upgrade-base-build.log
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/voiceledger-upgrade-base.apk"
          ./gradlew --no-daemon --stacktrace -PvoiceledgerVersionCode="$((GITHUB_RUN_NUMBER + 1))" \
            :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee artifacts/android-gradle.log
      - name: Exercise the signing step with a disposable debug certificate
        run: |
          umask 077
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          store="$RUNNER_TEMP/voiceledger-debug-rehearsal.p12"
          base="$RUNNER_TEMP/voiceledger-upgrade-base.apk"
          apk=app/build/outputs/apk/debug/app-debug.apk
          test_apk=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 7 \
            -dname "CN=VoiceLedger CI Debug" -keystore "$store" -storetype PKCS12 -storepass android
          pin="$(keytool -exportcert -alias androiddebugkey -keystore "$store" -storepass android | sha256sum | cut -d ' ' -f 1)"
          export VOICELEDGER_ANDROID_DEBUG_CERT_SHA256="$pin"
          VOICELEDGER_ANDROID_DEBUG_SIGNING="$(python3 -c 'import base64,json,pathlib,sys; print(json.dumps({"pkcs12":base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode(),"password":"android"}))' "$store")" \
            python3 ../scripts/sign_android_debug.py "$signer" \
            "$base" "$RUNNER_TEMP/rehearsal-base.apk" "$apk" "$RUNNER_TEMP/rehearsal-next.apk" \
            "$test_apk" "$RUNNER_TEMP/rehearsal-test.apk" \
            | tee artifacts/android-rehearsal-cert.txt
          mv "$RUNNER_TEMP/rehearsal-base.apk" "$base"
          mv "$RUNNER_TEMP/rehearsal-next.apk" "$apk"
          mv "$RUNNER_TEMP/rehearsal-test.apk" "$test_apk"
          rm -f "$store"
      - name: Run the packaged Android ARM64 recording and live transcription
        run: bash ../scripts/check_android_runtime.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: nemotron-diagnostics
          path: android/artifacts/
          if-no-files-found: error
