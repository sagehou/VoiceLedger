name: ASR comparison

on:
  push:
    branches: [ci/vl-asr-comparison]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build the packaged adapters
        run: python3 scripts/build_speech.py --work "$RUNNER_TEMP/asr-native" --output artifacts
      - name: Generate the common corpus and verify pinned model weights
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001
          python3 scripts/check_asr_languages.py "$RUNNER_TEMP/corpus"
          python3 scripts/check_asr_languages.py "$RUNNER_TEMP/corpus" --model sensevoice-small-int8 --download-only
      - name: Compare speed and quality without network access
        run: |
          offline() {
            sudo unshare --net --setgid="$(id -g)" --setuid="$(id -u)" -- env \
              LD_LIBRARY_PATH="$PWD/artifacts" GITHUB_SHA="$GITHUB_SHA" "$(command -v python3)" \
              scripts/check_asr_languages.py "$RUNNER_TEMP/corpus" --compare "$@"
          }
          offline --library artifacts/libvoiceledger_whisper.so --report artifacts/whisper-baseline.json
          offline --model sensevoice-small-int8 --library artifacts/libvoiceledger_sensevoice.so --report artifacts/sensevoice.json
          sed -i '/settings.no_context = true;/a\    settings.audio_ctx = 768;\n    settings.greedy.best_of = 1;\n    settings.temperature_inc = 0.0f;' native/speech/whisper.cpp
          cmake --build "$RUNNER_TEMP/asr-native/adapters" --config Release --target voiceledger_whisper --parallel 3
          cmake --install "$RUNNER_TEMP/asr-native/adapters" --config Release --prefix "$PWD/artifacts"
          offline --library artifacts/libvoiceledger_whisper.so --report artifacts/whisper-tuned.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: asr-comparison
          path: artifacts/*.json
