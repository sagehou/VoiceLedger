[package]
name = "voiceledger-speech"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libloading = "=0.8.9"
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
voiceledger-audio = { path = "../audio" }
voiceledger-core = { path = ".." }
webrtc-vad = "=0.4.0"
