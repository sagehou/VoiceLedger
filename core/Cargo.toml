[package]
name = "voiceledger-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aws-credential-types = "=1.3.1"
aws-sigv4 = "=1.6.6"
base64 = "=0.23.1"
ring = "=0.17.14"
roxmltree = "=0.21.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
zeroize = "=1.9.2"

[workspace]
members = ["ffi"]
resolver = "3"
